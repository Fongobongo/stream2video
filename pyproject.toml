[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stream2video"
version = "0.3.1"
description = "CLI tool to compress stream recordings by removing silence"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "stream2video"}]
requires-python = ">=3.13"
dependencies = [
    "yt-dlp>=2024.01.01",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
# Dev = linting + typing + tests. Includes the [gui] extra so the full
# test suite (gui/waveform tests + import-smoke test_import_gui) runs
# out of the box on `pip install -e .[dev]`.
#
# NOTE: pytest-qt and PySide6 were removed (audit). The GUI event-loop
# tests (test_gui_qt.py) drive the Tk event loop directly via
# ``update()``/``_flush_events`` — no test consumes the ``qtbot`` fixture.
# The pytest-qt *plugin* still loaded at pytest startup and imported
# PySide6, which crashed the ubuntu CI runner at collection time
# (``ImportError: libEGL.so.1`` — headless boxes lack the Qt shared libs).
# Dropping the plugin removes the Qt dependency from CI entirely; Tk
# tests skip cleanly on headless envs via the conftest TclError guard.
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-timeout>=2.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
    "psutil>=5.9.0",
    "numpy>=1.26.0",
    "stream2video[gui]",
    "stream2video[monitor]",
]
gui = [
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
]
# Memory monitoring (P1.17): optional psutil dependency. When installed,
# ``stream2video.memory.MemoryMonitor`` actively tracks the ffmpeg/yt-dlp
# subprocess RSS and cancels a runaway encode before the OS swaps. When
# absent, the monitor degrades to a no-op and the historical behaviour
# (no memory guardrail) is preserved.
monitor = [
    "psutil>=5.9.0",
]

[project.scripts]
# Brand: the user-facing commands are "silencecut" / "silencecut-gui".
# The import package stays ``stream2video`` (no settings/data migration);
# the legacy command names below are kept as deprecated aliases so
# existing scripts and muscle memory keep working.
silencecut = "stream2video.cli:app"
silencecut-gui = "stream2video.gui:main"
stream2video = "stream2video.cli:app"
stream2video-gui = "stream2video.gui:main"

[tool.setuptools.package-data]
# PEP 561: ship the inline types marker so IDEs / downstream mypy see the
# fully-typed public API instead of treating the import as untyped.
stream2video = ["py.typed"]

[tool.setuptools.packages.find]
where = ["."]
include = ["stream2video*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 30
timeout_method = "thread"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]
ignore = [
    "E501",   # line length (handled by formatter / line-length)
    "B008",   # function call in default argument (FastAPI/typer pattern)
    "SIM105", # contextlib.suppress vs try/except pass (style)
    "SIM108", # ternary vs if/else (style, sometimes less readable)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]  # asserts are fine in tests

[tool.ruff.lint.isort]
known-first-party = ["stream2video"]

[tool.mypy]
python_version = "3.13"
mypy_path = "stream2video"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = false
pretty = true
show_error_codes = true
exclude = [
    "build/",
    "dist/",
    ".venv/",
    "_portable/",
    "stream2video.egg-info/",
]

# Mixin classes (Этап 10) access cross-mixin attributes on ``self`` that
# mypy can't see without the full composite class. The Protocol pattern
# (inheriting from a Protocol) breaks CTk's runtime MRO, so we suppress
# attr-defined errors on the mixin modules instead. The composite class
# (gui.py) is fully checked — it inherits from every mixin and CTk.
[[tool.mypy.overrides]]
module = [
    "stream2video.gui_advanced",
    "stream2video.gui_dialogs",
    "stream2video.gui_encoder_panel",
    "stream2video.gui_file_info",
    "stream2video.gui_lifecycle",
    "stream2video.gui_main_window_build",
    "stream2video.gui_progress_ui",
    "stream2video.gui_recent_projects",
    "stream2video.gui_sliders",
    "stream2video.gui_waveform",
    "stream2video.gui_waveform_interactions",
    "stream2video.gui_waveform_render",
    "stream2video.gui_waveform_window",
]
disable_error_code = ["attr-defined", "misc", "has-type"]

# Platform-gated Windows-only code (winsound.PlaySound, ctypes.WinDLL,
# OSError.winerror): marked with ``# type: ignore[attr-defined]`` for CI's
# Linux run, but those ignores are unused on Windows — disable the
# unused-ignore warning on just these modules so both platforms pass.
[[tool.mypy.overrides]]
module = ["stream2video.completion_sound", "stream2video.tools"]
warn_unused_ignores = false
