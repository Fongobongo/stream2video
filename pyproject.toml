[build-system]
requires = ["setuptools>=45", "wheel", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "stream2video"
version = "0.1.0"
description = "CLI tool to compress stream recordings by removing silence"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "stream2video"}]
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.01.01",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
stream2video = "stream2video.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["stream2video*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
