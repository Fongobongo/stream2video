# stream2video - default aggressive config
# Removes more silence, more aggressive cutting
#
# NOTE: Higher dB = more aggressive (detects more silence)
#   e.g. -5 dB = very aggressive, -30 dB = gentle

threshold: -30  # Higher = more aggressive (range: -60 to -5 dB)
min_silence: 0.3  # Shorter = more aggressive (range: 0.1 to 60)
margin: 0.05  # Smaller = tighter cuts (range: -3 to 5)
